<!-- OFFLINE-FIRST CORE REQUIREMENT: APPLICATION STARTUP MUST NEVER DEPEND ON NETWORK CONNECTIVITY. NETWORK FAILURE MUST NEVER REDIRECT TO OR REPLACE THE NORMAL APPLICATION SHELL WITH AN OFFLINE PAGE. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6750A4" />
    <link rel="manifest" href="/manifest.json" />
    <title>Office Management System v6.0</title>
    <script>
      window.__EXFIN_STARTUP_COUNT = (window.__EXFIN_STARTUP_COUNT || 0) + 1;
      console.log('[OFFLINE-ROOT] JavaScript bundle executed, count:', window.__EXFIN_STARTUP_COUNT);
      window.addEventListener('DOMContentLoaded', function() {
        console.log('[OFFLINE-ROOT] DOMContentLoaded');
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then(function (registration) {
            if (registration.active) {
              console.log('[STARTUP_PERF] [PWA_CACHE_READY] Service worker active and cache ready');
            }
            registration.onupdatefound = function () {
              var installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function () {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[STARTUP_PERF] [SERVICE_WORKER_UPDATED] New service worker version installed');
                  }
                };
              }
            };
            registration.update().catch(function () {});
          })
          .catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
      }
    </script>
  </head>
  <body>
    <!-- TEMPORARY ON-DEVICE DIAGNOSTIC BANNER (TOPMOST, FIXED, NO DEPENDENCY ON REACT) -->
    <div id="exfin-native-diagnostic-banner" style="position: fixed; top: 0; left: 0; right: 0; z-index: 2147483647; background: #0f172a; color: #f8fafc; border-bottom: 4px solid #ef4444; padding: 10px 14px; font-family: monospace; font-size: 12px; line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,0.9); pointer-events: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 6px;">
        <span style="font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 6px;">
          <span style="width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: inline-block;"></span>
          EXFIN OFFLINE DIAGNOSTIC V6
        </span>
        <span id="diag-time" style="color: #94a3b8; font-size: 11px;">Initializing...</span>
      </div>
      <div id="diag-warning" style="display: none; background: #7f1d1d; color: #fecaca; padding: 4px 8px; border-radius: 4px; font-weight: bold; text-align: center; margin-bottom: 6px;">
        ⚠️ PAGE RELOAD DETECTED
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 11px;">
        <div>Boot Count: <strong id="diag-boot" style="color: #34d399;">1</strong></div>
        <div>React Root: <strong id="diag-react" style="color: #34d399;">0</strong></div>
        <div>App Mount: <strong id="diag-app-mount" style="color: #60a5fa;">0</strong></div>
        <div>App Unmount: <strong id="diag-app-unmount" style="color: #c084fc;">0</strong></div>
        <div>Offline Mount: <strong id="diag-offline-mount" style="color: #fbbf24;">0</strong></div>
        <div>Offline Unmount: <strong id="diag-offline-unmount" style="color: #fbbf24;">0</strong></div>
        <div>Network: <strong id="diag-network" style="color: #34d399;">...</strong></div>
        <div>Visibility: <strong id="diag-visibility" style="color: #22d3ee;">...</strong></div>
      </div>
      <div style="border-top: 1px solid #334155; margin-top: 6px; padding-top: 4px; font-size: 10px; color: #cbd5e1;">
        <div>Route: <span id="diag-route" style="color: #e2e8f0;">/</span></div>
        <div>Last Event: <span id="diag-event" style="color: #fbbf24;">LOADED</span></div>
      </div>
    </div>

    <script>
      window.__EXFIN_UPDATE_DIAGNOSTIC = function(data) {
        try {
          var bootEl = document.getElementById('diag-boot');
          var reactEl = document.getElementById('diag-react');
          var appMountEl = document.getElementById('diag-app-mount');
          var appUnmountEl = document.getElementById('diag-app-unmount');
          var offlineMountEl = document.getElementById('diag-offline-mount');
          var offlineUnmountEl = document.getElementById('diag-offline-unmount');
          var netEl = document.getElementById('diag-network');
          var visEl = document.getElementById('diag-visibility');
          var routeEl = document.getElementById('diag-route');
          var eventEl = document.getElementById('diag-event');
          var timeEl = document.getElementById('diag-time');
          var warnEl = document.getElementById('diag-warning');

          if (bootEl) bootEl.innerText = data.bootCount || 1;
          if (reactEl) reactEl.innerText = data.reactRootMount || 0;
          if (appMountEl) appMountEl.innerText = data.appMount || 0;
          if (appUnmountEl) appUnmountEl.innerText = data.appUnmount || 0;
          if (offlineMountEl) offlineMountEl.innerText = data.offlineMount || 0;
          if (offlineUnmountEl) offlineUnmountEl.innerText = data.offlineUnmount || 0;
          if (netEl) {
            netEl.innerText = data.isOnline ? 'ONLINE' : 'OFFLINE';
            netEl.style.color = data.isOnline ? '#34d399' : '#f87171';
          }
          if (visEl) visEl.innerText = (data.visibility || 'visible') + ' (' + (data.visibilityChanges || 0) + ')';
          if (routeEl) routeEl.innerText = data.route || '/';
          if (eventEl) eventEl.innerText = data.lastEvent || 'RUNNING';
          if (timeEl) timeEl.innerText = new Date().toLocaleTimeString();

          if (warnEl) {
            if ((data.bootCount || 1) > 1 || (data.reloads || 0) > 0) {
              warnEl.style.display = 'block';
              warnEl.innerText = '⚠️ PAGE RELOAD DETECTED (' + (data.bootCount || 1) + ')';
            } else {
              warnEl.style.display = 'none';
            }
          }
        } catch (e) {
          console.error('Error updating diagnostic banner:', e);
        }
      };

      // Initial immediate sync
      setInterval(function() {
        if (window.__EXFIN_DIAG_STATE) {
          window.__EXFIN_UPDATE_DIAGNOSTIC(window.__EXFIN_DIAG_STATE);
        } else {
          window.__EXFIN_UPDATE_DIAGNOSTIC({
            bootCount: window.__EXFIN_STARTUP_COUNT || 1,
            isOnline: navigator.onLine,
            route: window.location.pathname,
            visibility: document.visibilityState,
            lastEvent: 'HTML_BOOT'
          });
        }
      }, 500);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
