<!-- OFFLINE-FIRST CORE REQUIREMENT: APPLICATION STARTUP MUST NEVER DEPEND ON NETWORK CONNECTIVITY. NETWORK FAILURE MUST NEVER REDIRECT TO OR REPLACE THE NORMAL APPLICATION SHELL WITH AN OFFLINE PAGE. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6750A4" />
    <link rel="manifest" href="/manifest.json" />
    <title>Office Management System v6.0</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then(function (registration) {
            if (registration.active) {
              console.log('[STARTUP_PERF] [PWA_CACHE_READY] Service worker active and cache ready');
            }
            registration.onupdatefound = function () {
              var installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function () {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[STARTUP_PERF] [SERVICE_WORKER_UPDATED] New service worker version installed');
                  }
                };
              }
            };
            registration.update().catch(function () {});
          })
          .catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
