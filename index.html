<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6750A4" />
    <link rel="manifest" href="/manifest.json" />
    <title>EXFIN OMS ENTERPRISE v6.0</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then((registration) => {
            if (registration.active) {
              console.log('[STARTUP_PERF] [PWA_CACHE_READY] Service worker active and cache ready');
            }
            registration.onupdatefound = () => {
              const installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[STARTUP_PERF] [SERVICE_WORKER_UPDATED] New service worker version installed');
                  }
                };
              }
            };
            // Check for updates periodically and upon foregrounding
            registration.update().catch(() => {});
          })
          .catch((err) => {
            console.warn('Service worker registration failed:', err);
          });
      }
    </script>
  </body>
</html>
