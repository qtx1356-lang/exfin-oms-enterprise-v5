apply plugin: 'com.android.application'

def getAppVersionCode = { ->
    if (project.hasProperty('versionCode')) {
        return project.property('versionCode').toString().toInteger()
    }
    def envCode = System.getenv('ANDROID_VERSION_CODE') ?: System.getenv('VERSION_CODE')
    if (envCode && envCode.isInteger()) {
        return envCode.toInteger()
    }
    return 1
}

def getAppVersionName = { ->
    if (project.hasProperty('versionName')) {
        return project.property('versionName').toString()
    }
    def envName = System.getenv('ANDROID_VERSION_NAME') ?: System.getenv('VERSION_NAME')
    if (envName && !envName.isEmpty()) {
        return envName
    }
    return "1.0.0"
}

android {
    namespace "com.exfin.oms"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.exfin.oms"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getAppVersionCode()
        versionName getAppVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE') ?: project.findProperty('RELEASE_STORE_FILE')
            if (keystorePath && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: project.findProperty('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: project.findProperty('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: project.findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$rootProject.ext.androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-location:21.2.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications require google-services.json")
}
