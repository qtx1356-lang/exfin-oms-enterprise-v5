name: Daily Admin Report Scheduler

on:
  schedule:
    # Runs every 5 minutes. Attendance settlement uses the previous IST day,
    # so it is reliable even when every employee app is closed at midnight.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Attendance End-of-Day Settlement
        env:
          DAILY_REPORT_URL: ${{ secrets.DAILY_REPORT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          BASE_URL="${DAILY_REPORT_URL:-https://your-domain.pages.dev}"
          BASE_URL="${BASE_URL%/}"

          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET secret is missing in GitHub repository secrets."
            exit 1
          fi

          ATTENDANCE_ENDPOINT="${BASE_URL}/api/internal/attendance-eod-settlement"
          echo "Calling attendance settlement endpoint: $ATTENDANCE_ENDPOINT"

          HTTP_STATUS=$(curl -sS -o attendance-settlement.json -w "%{http_code}" \
            -X POST \
            "$ATTENDANCE_ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}')

          echo "Attendance settlement HTTP status: $HTTP_STATUS"
          cat attendance-settlement.json
          echo ""

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "FAILURE: Attendance end-of-day settlement failed."
            exit 1
          fi

      - name: Trigger Daily Admin Report Scheduler
        env:
          DAILY_REPORT_URL: ${{ secrets.DAILY_REPORT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          echo "Triggering Daily Admin Report scheduler..."

          BASE_URL="${DAILY_REPORT_URL:-https://your-domain.pages.dev}"
          BASE_URL="${BASE_URL%/}"
          ENDPOINT="${BASE_URL}/api/internal/daily-admin-report"

          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET secret is missing in GitHub repository secrets."
            exit 1
          fi

          PAYLOAD='{"source":"github-actions"}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PAYLOAD='{"source":"github-actions-dispatch","force":true}'
            echo "Manual workflow_dispatch trigger detected (force=true)."
          fi

          echo "Calling scheduler endpoint at: $ENDPOINT"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")

          echo "HTTP status: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "FAILURE: Daily Admin Report scheduler failed."
            exit 1
          fi

          echo "SUCCESS: Daily Admin Report scheduler triggered successfully."
