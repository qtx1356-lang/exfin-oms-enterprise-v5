name: Clean Location Repair UI State

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean unused repair UI state
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/attendance/AttendanceScreen.tsx')
          text = p.read_text()
          text = text.replace('  openNativeAppLocationSettings,\n  repairNativeLocationMonitoring,\n  NativeLocationReadiness', '  openNativeAppLocationSettings,\n  NativeLocationReadiness')
          text = text.replace('  const [isRepairingMonitoring, setIsRepairingMonitoring] = useState<boolean>(false);\n\n', '')
          text = text.replace('  }, [nativeReadiness, isGpsOff, isRepairingMonitoring, checkReadiness, refreshLocation]);', '  }, [nativeReadiness, isGpsOff]);')
          p.write_text(text)

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/attendance/AttendanceScreen.tsx .github/workflows/cleanup-location-ui-self-heal.yml
          git rm .github/workflows/cleanup-location-ui-self-heal.yml
          git commit -m "fix: clean location repair UI state"
          git push
