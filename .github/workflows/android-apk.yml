name: Android APK Build & Release

on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: 'Release Notes (optional)'
        required: false
        default: 'Improved Android automatic update discovery'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Optimized Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Calculate Next Automatic Version Code and Semantic Version Name
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          let highestCode = 9;
          let highestName = "1.0.8";

          // 1. Read local manifest
          try {
            if (fs.existsSync("public/android-version-manifest.json")) {
              const manifest = JSON.parse(fs.readFileSync("public/android-version-manifest.json", "utf8"));
              if (typeof manifest.versionCode === "number") {
                highestCode = Math.max(highestCode, manifest.versionCode);
              }
              if (typeof manifest.versionName === "string" && manifest.versionName.trim()) {
                highestName = manifest.versionName.trim();
              }
            }
          } catch (err) {
            console.warn("Could not read local manifest:", err.message);
          }

          // 2. Query git tags
          try {
            execSync("git fetch --tags --force 2>/dev/null || true");
            const tagsOutput = execSync("git tag -l").toString().trim();
            if (tagsOutput) {
              const tags = tagsOutput.split("\n").map(t => t.trim()).filter(t => t.startsWith("v"));
              for (const tag of tags) {
                const semver = tag.substring(1);
                const parts = semver.split(".").map(p => parseInt(p, 10));
                if (parts.length === 3 && !parts.some(isNaN)) {
                  let estimatedCode = 0;
                  if (parts[0] === 1 && parts[1] === 0) {
                    estimatedCode = parts[2] + 1;
                  }
                  highestCode = Math.max(highestCode, estimatedCode);

                  const curParts = highestName.split(".").map(p => parseInt(p, 10));
                  if (curParts.length === 3 && !curParts.some(isNaN)) {
                    if (parts[0] > curParts[0] ||
                       (parts[0] === curParts[0] && parts[1] > curParts[1]) ||
                       (parts[0] === curParts[0] && parts[1] === curParts[1] && parts[2] > curParts[2])) {
                      highestName = semver;
                    }
                  }
                }
              }
            }
          } catch (err) {
            console.warn("Could not parse local git tags:", err.message);
          }

          // 3. Query gh releases and download their manifests
          try {
            const releaseListOutput = execSync("gh release list --limit 10 --json tagName 2>/dev/null || true").toString().trim();
            if (releaseListOutput) {
              const releases = JSON.parse(releaseListOutput);
              for (const rel of releases) {
                if (rel.tagName && rel.tagName.startsWith("v")) {
                  const semver = rel.tagName.substring(1);
                  const parts = semver.split(".").map(p => parseInt(p, 10));
                  if (parts.length === 3 && !parts.some(isNaN)) {
                    try {
                      const tempDir = `/tmp/release-${rel.tagName}`;
                      execSync(`mkdir -p ${tempDir} && gh release download ${rel.tagName} --pattern "android-version-manifest.json" --dir ${tempDir} --clobber 2>/dev/null || true`);
                      const manifestPath = `${tempDir}/android-version-manifest.json`;
                      if (fs.existsSync(manifestPath)) {
                        const remoteManifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
                        if (typeof remoteManifest.versionCode === "number") {
                          highestCode = Math.max(highestCode, remoteManifest.versionCode);
                        }
                        if (typeof remoteManifest.versionName === "string" && remoteManifest.versionName.trim()) {
                          const rParts = remoteManifest.versionName.trim().split(".").map(p => parseInt(p, 10));
                          const curParts = highestName.split(".").map(p => parseInt(p, 10));
                          if (rParts.length === 3 && !rParts.some(isNaN) && curParts.length === 3 && !curParts.some(isNaN)) {
                            if (rParts[0] > curParts[0] ||
                               (rParts[0] === curParts[0] && rParts[1] > curParts[1]) ||
                               (rParts[0] === curParts[0] && rParts[1] === curParts[1] && rParts[2] > curParts[2])) {
                              highestName = remoteManifest.versionName.trim();
                            }
                          }
                        }
                      } else {
                        let estimatedCode = 0;
                        if (parts[0] === 1 && parts[1] === 0) {
                          estimatedCode = parts[2] + 1;
                        }
                        highestCode = Math.max(highestCode, estimatedCode);
                        
                        const curParts = highestName.split(".").map(p => parseInt(p, 10));
                        if (curParts.length === 3 && !curParts.some(isNaN)) {
                          if (parts[0] > curParts[0] ||
                             (parts[0] === curParts[0] && parts[1] > curParts[1]) ||
                             (parts[0] === curParts[0] && parts[1] === curParts[1] && parts[2] > curParts[2])) {
                            highestName = semver;
                          }
                        }
                      }
                    } catch (e) {}
                  }
                }
              }
            }
          } catch (err) {
            console.warn("Could not query GitHub releases via CLI:", err.message);
          }

          // Calculate final next values
          const nextVersionCode = highestCode + 1;
          let nextVersionName = highestName;

          const nameParts = highestName.split(".").map(p => parseInt(p, 10));
          if (nameParts.length === 3 && !nameParts.some(isNaN)) {
            nextVersionName = `${nameParts[0]}.${nameParts[1]}.${nameParts[2] + 1}`;
          } else {
            nextVersionName = `1.0.${nextVersionCode - 1}`;
          }

          console.log(`=== DETERMINED NEXT AUTOMATIC VERSION ===`);
          console.log(`Highest Known Version Code: ${highestCode}`);
          console.log(`Highest Known Version Name: ${highestName}`);
          console.log(`Calculated Next Version Code: ${nextVersionCode}`);
          console.log(`Calculated Next Version Name: ${nextVersionName}`);

          fs.appendFileSync(process.env.GITHUB_ENV, `VERSION_CODE=${nextVersionCode}\nVERSION_NAME=${nextVersionName}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_code=${nextVersionCode}\nversion_name=${nextVersionName}\n`);

          // Update local public/android-version-manifest.json in workspace before building
          const repo = process.env.GITHUB_REPOSITORY || "qtx1356-lang/exfin-oms-enterprise-v5";
          const updatedManifest = {
            versionCode: nextVersionCode,
            versionName: nextVersionName,
            apkUrl: `https://github.com/${repo}/releases/download/v${nextVersionName}/EXFIN-OMS-Android-v${nextVersionName}.apk`,
            releaseNotes: [
              `EXFIN OMS Android update Version ${nextVersionName} (Build ${nextVersionCode})`
            ]
          };
          fs.writeFileSync("public/android-version-manifest.json", JSON.stringify(updatedManifest, null, 2) + "\n");
          console.log("Updated public/android-version-manifest.json successfully.");
          '

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json detected. Running npm ci..."
            npm ci
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build Web Assets
        run: |
          echo "Building web application..."
          npm run build

      - name: Sync Capacitor Android
        run: |
          echo "Syncing web assets to native Android project..."
          npx cap sync android

      - name: Validate and Set up Production Signing Key
        id: signing
        run: |
          echo "=== Checking Production Keystore Secrets ==="
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Production release signing secrets are missing!"
            echo "The following GitHub Secrets are required to sign the release APK:"
            echo "  1. ANDROID_KEYSTORE_BASE64"
            echo "  2. ANDROID_KEYSTORE_PASSWORD"
            echo "  3. ANDROID_KEY_ALIAS"
            echo "  4. ANDROID_KEY_PASSWORD"
            echo "Release build aborted. Debug keystore fallback is strictly prohibited for production APKs."
            exit 1
          fi

          echo "Decoding release keystore from GitHub Secrets..."
          mkdir -p ${{ runner.temp }}/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/keystore/release.keystore
          echo "ANDROID_KEYSTORE_FILE=${{ runner.temp }}/keystore/release.keystore" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "Production keystore configured successfully."

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Optimized Android Release APK
        env:
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          cd android
          echo "Building Release APK with Version Code: $ANDROID_VERSION_CODE, Version Name: $ANDROID_VERSION_NAME..."
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate, Verify & Stage Release APK
        run: |
          echo "=== Locating Built APKs ==="
          find android/app/build/outputs -type f -name "*.apk" -print

          RELEASE_DIR="android/app/build/outputs/apk/release"
          RELEASE_APK=""
          if [ -f "$RELEASE_DIR/app-release.apk" ]; then
            RELEASE_APK="$RELEASE_DIR/app-release.apk"
          elif [ -d "$RELEASE_DIR" ]; then
            RELEASE_APK=$(find "$RELEASE_DIR" -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: No release APK found in Android build outputs."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Found Android release APK: $RELEASE_APK"

          echo "=== APK Verification & Signing Details ==="
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose --print-certs "$RELEASE_APK" || true
          fi

          echo "APK SHA-256 Checksum:"
          sha256sum "$RELEASE_APK"

          echo "APK Exact Size:"
          ls -l "$RELEASE_APK"

          mkdir -p artifact
          APK_FILENAME="EXFIN-OMS-Android-v${{ env.VERSION_NAME }}.apk"
          cp "$RELEASE_APK" "artifact/$APK_FILENAME"
          cp "$RELEASE_APK" "artifact/exfin-oms-android.apk"
          echo "Staged APK to artifact/$APK_FILENAME and artifact/exfin-oms-android.apk"

          # Stage update manifest matching the built APK
          REPO_NAME="${{ github.repository }}"
          APK_DOWNLOAD_URL="https://github.com/${REPO_NAME}/releases/download/v${{ env.VERSION_NAME }}/${APK_FILENAME}"

          cat <<EOF > artifact/android-version-manifest.json
          {
            "versionCode": ${{ env.VERSION_CODE }},
            "versionName": "${{ env.VERSION_NAME }}",
            "apkUrl": "${APK_DOWNLOAD_URL}",
            "releaseNotes": [
              "Automatic Android update release"
            ]
          }
          EOF

          echo "=== Generated Manifest ==="
          cat artifact/android-version-manifest.json

      - name: Validate APK Metadata and Manifest Consistency
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          node -e '
          const { execSync } = require("child_process");
          const fs = require("fs");

          const expectedCode = process.env.VERSION_CODE;
          const expectedName = process.env.VERSION_NAME;
          const apkPath = "artifact/exfin-oms-android.apk";
          const manifestPath = "artifact/android-version-manifest.json";

          console.log(`=== STARTING APK VALIDATION ===`);
          console.log(`Expected Application ID: com.exfin.oms`);
          console.log(`Expected Version Code: ${expectedCode}`);
          console.log(`Expected Version Name: ${expectedName}`);

          try {
            // 1. Verify manifest and build consistency
            if (!fs.existsSync(manifestPath)) {
              throw new Error("Local android-version-manifest.json not found in artifacts.");
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (String(manifest.versionCode) !== String(expectedCode)) {
              throw new Error(`Manifest Code Mismatch! expected=${expectedCode}, found=${manifest.versionCode}`);
            }
            if (String(manifest.versionName) !== String(expectedName)) {
              throw new Error(`Manifest Name Mismatch! expected=${expectedName}, found=${manifest.versionName}`);
            }
            console.log("Local manifest matches expectations.");

            // 2. Locate aapt tool
            const androidHome = process.env.ANDROID_HOME || "/usr/local/lib/android/sdk";
            const findAapt = execSync(`find ${androidHome}/build-tools -name aapt | head -n 1`).toString().trim();
            if (!findAapt) {
              throw new Error("aapt tool not found in Android SDK directory.");
            }
            console.log(`Using aapt tool at: ${findAapt}`);

            // 3. Run aapt dump badging
            const dump = execSync(`"${findAapt}" dump badging ${apkPath}`).toString();
            
            // 4. Parse package line
            const packageLine = dump.split("\n").find(line => line.startsWith("package:"));
            if (!packageLine) {
              throw new Error("Could not find package line in aapt dump badging output.");
            }
            console.log(`Found package line: ${packageLine}`);

            // 5. Extract values and assert
            const nameMatch = packageLine.match(/name=\x27([^\x27]+)\x27/);
            const codeMatch = packageLine.match(/versionCode=\x27([^\x27]+)\x27/);
            const nameValMatch = packageLine.match(/versionName=\x27([^\x27]+)\x27/);

            if (!nameMatch || nameMatch[1] !== "com.exfin.oms") {
              throw new Error(`Application ID mismatch! Found: ${nameMatch ? nameMatch[1] : "null"}`);
            }
            if (!codeMatch || String(codeMatch[1]) !== String(expectedCode)) {
              throw new Error(`Version Code mismatch! Found: ${codeMatch ? codeMatch[1] : "null"}`);
            }
            if (!nameValMatch || String(nameValMatch[1]) !== String(expectedName)) {
              throw new Error(`Version Name mismatch! Found: ${nameValMatch ? nameValMatch[1] : "null"}`);
            }

            console.log(`APK validation succeeded! All checks passed.`);
          } catch (err) {
            console.error(`::error::APK validation failed: ${err.message}`);
            process.exit(1);
          }
          '

      - name: Display Build & Size Information
        run: |
          echo "=== Build Environment & Artifact Information ==="
          java -version 2>&1 || true
          node -v || true
          (cd android && ./gradlew --version) || true
          echo "Optimized Release APK Size:"
          ls -lh artifact/*.apk || true

      - name: Upload APK & Manifest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exfin-oms-android-release
          path: |
            artifact/*.apk
            artifact/android-version-manifest.json
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "EXFIN OMS Release v${{ env.VERSION_NAME }}"
          body: |
            ## EXFIN OMS Android App Update v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
            
            ### What's New:
            - Automatic Android update release
            
            ### Direct APK Download:
            - **APK:** [EXFIN-OMS-Android-v${{ env.VERSION_NAME }}.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/EXFIN-OMS-Android-v${{ env.VERSION_NAME }}.apk)
            - **Stable Link:** [exfin-oms-android.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/exfin-oms-android.apk)
          files: |
            artifact/*.apk
            artifact/android-version-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated Manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/android-version-manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump android version to v${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }}) [skip ci]"
            git push origin main
          fi
