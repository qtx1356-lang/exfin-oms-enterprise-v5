name: Android APK Build & Release

on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: 'Release Notes (optional)'
        required: false
        default: 'Improved Android automatic update discovery'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/android-version-manifest.json'

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Optimized Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # The remaining release/build steps are intentionally unchanged.
      # This workflow now only triggers from Android/native-relevant changes
      # or an explicit manual dispatch; admin-only public assets do not create APKs.
