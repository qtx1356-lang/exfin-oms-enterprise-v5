name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json detected. Running npm ci..."
            npm ci
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build Web Assets
        run: |
          echo "Building web application..."
          npm run build

      - name: Sync Capacitor Android
        run: |
          echo "Syncing web assets to native Android project..."
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Stage APK
        run: |
          echo "=== Locating Built APKs ==="
          find android/app/build/outputs -type f -name "*.apk" -print

          DEBUG_DIR="android/app/build/outputs/apk/debug"
          if [ -d "$DEBUG_DIR" ]; then
            DEBUG_APK=$(find "$DEBUG_DIR" -type f -name "*.apk" | head -n 1)
          else
            DEBUG_APK=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "ERROR: No debug APK found in Android build outputs."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Found Android debug APK: $DEBUG_APK"

          mkdir -p artifact
          cp "$DEBUG_APK" artifact/EXFIN-OMS-Android-Debug.apk
          echo "Staged APK to artifact/EXFIN-OMS-Android-Debug.apk"

      - name: Display Build Information
        run: |
          echo "=== Build Environment & Artifact Information ==="
          echo "Java Version:"
          java -version 2>&1 || true
          echo "Node Version:"
          node -v || true
          echo "Gradle Version:"
          (cd android && ./gradlew --version) || true
          echo "APK Artifact:"
          ls -lh artifact/EXFIN-OMS-Android-Debug.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfin-oms-android-apk
          path: artifact/EXFIN-OMS-Android-Debug.apk
          if-no-files-found: error
