name: Fix audit trail employee identity lookup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-audit-trail-all-employees.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch audit trail lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/admin/AdminDashboard.tsx')
          text = p.read_text(encoding='utf-8')

          old = '''    const fetchAuditEvents = async () => {
      try {
        const eventsRef = collection(db, 'attendance_events');
        const qEvts = query(
          eventsRef,
          where('employeeId', '==', empId),
          where('attendanceDate', '==', attDate)
        );
        const snap = await getDocs(qEvts);
        if (!snap.empty) {
          const fetchedEvents: AttendanceHistoryEvent[] = [];
          snap.forEach((docSnap) => {
            const data = docSnap.data();
            fetchedEvents.push({
              eventId: data.eventId || docSnap.id,
              employeeId: data.employeeId,
              eventType: data.eventType,
              eventTime: data.eventTime,
              timestamp: data.eventIso || data.createdAt || data.timestamp || data.syncedAt || data.eventTime,
              source: data.source || 'NATIVE_GEOFENCE',
              location: data.location,
              distance: data.location?.distance ?? data.distance,
              action: data.action
            });
          });
          setForensicEvents((prev) => {
            const map = new Map<string, AttendanceHistoryEvent>();
            for (const item of [...prev, ...fetchedEvents]) {
              if (item && item.eventId) map.set(item.eventId, item);
            }
            return Array.from(map.values()).sort((a, b) => {
              const tA = new Date(a.timestamp).getTime();
              const tB = new Date(b.timestamp).getTime();
              if (isNaN(tA) || isNaN(tB)) return 0;
              return tA - tB;
            });
          });
        }
      } catch (err) {
        console.warn('[AdminDashboard] Failed to fetch forensic attendance_events:', err);
      }
    };'''

          new = '''    const fetchAuditEvents = async () => {
      try {
        const eventsRef = collection(db, 'attendance_events');

        // Employee identity is not guaranteed to be stored under the same field
        // for every historical event. Older/newer records may use employeeId or
        // employeeCode, while the selected attendance record may expose either.
        // Query both forms so the audit trail works for every employee, not only
        // records whose event documents happen to use employeeId.
        const identifiers = Array.from(new Set([
          empId,
          selectedAttendance.employeeId,
          selectedAttendance.employeeCode,
        ].filter((value): value is string => typeof value === 'string' && value.trim().length > 0)
          .map((value) => value.trim())));

        const fetchedByKey = new Map<string, AttendanceHistoryEvent>();
        const queries = [];

        for (const identifier of identifiers) {
          queries.push(
            getDocs(query(
              eventsRef,
              where('employeeId', '==', identifier),
              where('attendanceDate', '==', attDate)
            ))
          );
          queries.push(
            getDocs(query(
              eventsRef,
              where('employeeCode', '==', identifier),
              where('attendanceDate', '==', attDate)
            ))
          );
        }

        const snapshots = await Promise.all(queries);
        snapshots.forEach((snap) => {
          snap.forEach((docSnap) => {
            const data = docSnap.data();
            const event: AttendanceHistoryEvent = {
              eventId: data.eventId || docSnap.id,
              employeeId: data.employeeId || data.employeeCode,
              eventType: data.eventType,
              eventTime: data.eventTime,
              timestamp: data.eventIso || data.createdAt || data.timestamp || data.syncedAt || data.eventTime,
              source: data.source || 'NATIVE_GEOFENCE',
              location: data.location,
              distance: data.location?.distance ?? data.distance,
              action: data.action
            };

            if (event.eventId) fetchedByKey.set(event.eventId, event);
          });
        });

        const fetchedEvents = Array.from(fetchedByKey.values());
        setForensicEvents((prev) => {
          const map = new Map<string, AttendanceHistoryEvent>();
          for (const item of [...prev, ...fetchedEvents]) {
            if (item && item.eventId) map.set(item.eventId, item);
          }
          return Array.from(map.values()).sort((a, b) => {
            const tA = new Date(a.timestamp).getTime();
            const tB = new Date(b.timestamp).getTime();
            if (isNaN(tA) || isNaN(tB)) return 0;
            return tA - tB;
          });
        });
      } catch (err) {
        console.warn('[AdminDashboard] Failed to fetch forensic attendance_events for employee identity variants:', err);
      }
    };'''

          if old not in text:
              raise SystemExit('Audit event lookup block not found; refusing to modify AdminDashboard.tsx')

          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -q "where('employeeCode', '==', identifier)" src/features/admin/AdminDashboard.tsx
          grep -q "Employee identity is not guaranteed" src/features/admin/AdminDashboard.tsx

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-audit-trail-all-employees.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/admin/AdminDashboard.tsx .github/workflows/fix-audit-trail-all-employees.yml
          git commit -m "Fix chronological audit trail for all employee IDs"
          git push origin main
