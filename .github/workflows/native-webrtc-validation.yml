name: Native WebRTC validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: native-webrtc-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Set up Java for Android compile
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore and validate Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is required to compile the Android app with its existing Firebase configuration."
            exit 1
          fi
          normalized_value="$(printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]')"
          normalized_value="${normalized_value#\"}"
          normalized_value="${normalized_value%\"}"
          normalized_value="${normalized_value#\'}"
          normalized_value="${normalized_value%\'}"
          if [[ "$normalized_value" == \{* ]]; then
            printf '%s' "$normalized_value" > android/app/google-services.json
          else
            printf '%s' "$normalized_value" | base64 --decode > android/app/google-services.json
          fi
          node -e '
            const fs = require("fs");
            const json = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
            const ok = Array.isArray(json.client) && json.client.some(c =>
              c.client_info?.android_client_info?.package_name === "com.exfin.oms");
            if (!ok) { console.error("Firebase config does not contain the com.exfin.oms Android client."); process.exit(1); }
            console.log("Firebase Android package validation passed.");
          '
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
