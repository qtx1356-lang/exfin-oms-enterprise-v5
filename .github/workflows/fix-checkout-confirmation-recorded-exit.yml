name: One-time Checkout Confirmation UI Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-checkout-confirmation-recorded-exit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch recorded-exit checkout modal
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/attendance/CheckoutConfirmationModal.tsx')
          text = path.read_text(encoding='utf-8')

          old_header = """                <h3 className=\"text-lg font-bold text-white tracking-tight leading-snug\">\n                  {isPreviousDay \n                    ? `Checkout not recorded for ${recordDateDisplay}`\n                    : 'Checkout time was not recorded'}\n                </h3>"""
          new_header = """                <h3 className=\"text-lg font-bold text-white tracking-tight leading-snug\">\n                  {isPreviousDay\n                    ? `Checkout not recorded for ${recordDateDisplay}`\n                    : suggestedExitTime\n                      ? 'Exit time recorded'\n                      : 'Checkout time was not recorded'}\n                </h3>"""

          old_subtitle = """            <p className=\"text-xs text-purple-200/90 font-medium pl-[58px]\">\n              {isPreviousDay\n                ? `Please enter your actual checkout time for ${recordDateDisplay}.`\n                : 'Please confirm your checkout time to complete your attendance.'}\n            </p>"""
          new_subtitle = """            <p className=\"text-xs text-purple-200/90 font-medium pl-[58px]\">\n              {isPreviousDay\n                ? `Please enter your actual checkout time for ${recordDateDisplay}.`\n                : suggestedExitTime\n                  ? 'The exit time was recorded automatically. Confirm checkout using this recorded time.'\n                  : 'Please confirm your checkout time to complete your attendance.'}\n            </p>"""

          old_exit_label = """                    Suggested Exit:"""
          new_exit_label = """                    Recorded Exit:"""

          old_picker = """            {/* Time Picker Control */}\n            <div className=\"space-y-2\">\n              <label className=\"block text-xs font-semibold text-purple-200\">\n                Select / Enter Checkout Time:\n              </label>\n              <div className=\"flex items-center gap-3\">\n                <div className=\"relative flex-1\">\n                  <Clock className=\"absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-purple-400 pointer-events-none\" />\n                  <input\n                    type=\"time\"\n                    value={timeInput24}\n                    onChange={handleTime24Change}\n                    className=\"w-full pl-9 pr-4 py-2.5 bg-purple-950/80 border border-purple-700/80 text-white rounded-xl focus:outline-none focus:border-purple-400 font-bold text-base cursor-pointer\"\n                  />\n                </div>\n                <div className=\"px-3 py-2.5 bg-purple-900/40 border border-purple-700/40 rounded-xl text-center min-w-[100px]\">\n                  <span className=\"text-xs text-purple-400 block font-mono\">12-Hour</span>\n                  <span className=\"text-sm font-bold text-amber-300\">{timeInput12}</span>\n                </div>\n              </div>\n            </div>"""
          new_picker = """            {/* Time Picker Control — only shown when no authoritative EXIT time exists. */}\n            {!suggestedExitTime && (\n              <div className=\"space-y-2\">\n                <label className=\"block text-xs font-semibold text-purple-200\">\n                  Select / Enter Checkout Time:\n                </label>\n                <div className=\"flex items-center gap-3\">\n                  <div className=\"relative flex-1\">\n                    <Clock className=\"absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-purple-400 pointer-events-none\" />\n                    <input\n                      type=\"time\"\n                      value={timeInput24}\n                      onChange={handleTime24Change}\n                      className=\"w-full pl-9 pr-4 py-2.5 bg-purple-950/80 border border-purple-700/80 text-white rounded-xl focus:outline-none focus:border-purple-400 font-bold text-base cursor-pointer\"\n                    />\n                  </div>\n                  <div className=\"px-3 py-2.5 bg-purple-900/40 border border-purple-700/40 rounded-xl text-center min-w-[100px]\">\n                    <span className=\"text-xs text-purple-400 block font-mono\">12-Hour</span>\n                    <span className=\"text-sm font-bold text-amber-300\">{timeInput12}</span>\n                  </div>\n                </div>\n              </div>\n            )}"""

          old_confirm_subtitle = """                    <div className=\"text-[11px] text-emerald-100/80 font-normal\">\n                      Finalize {recordDateDisplay} at {timeInput12}\n                    </div>"""
          new_confirm_subtitle = """                    <div className=\"text-[11px] text-emerald-100/80 font-normal\">\n                      {suggestedExitTime\n                        ? `Finalize ${recordDateDisplay} at recorded exit ${timeInput12}`\n                        : `Finalize ${recordDateDisplay} at ${timeInput12}`}\n                    </div>"""

          replacements = [
            (old_header, new_header),
            (old_subtitle, new_subtitle),
            (old_exit_label, new_exit_label),
            (old_picker, new_picker),
            (old_confirm_subtitle, new_confirm_subtitle),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Missing expected source block; refusing partial patch: {old[:120]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Checkout confirmation modal patched successfully.')

      - name: Verify patch
        run: |
          grep -n "Exit time recorded\|Recorded Exit\|only shown when no authoritative EXIT" src/components/attendance/CheckoutConfirmationModal.tsx

      - name: Commit fix and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-checkout-confirmation-recorded-exit.yml
          git add src/components/attendance/CheckoutConfirmationModal.tsx
          git commit -m "Fix checkout confirmation when exit time is recorded"
          git push origin HEAD:main
