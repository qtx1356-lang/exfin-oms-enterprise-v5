name: Fix Location Monitoring Self Heal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply self-healing attendance monitoring fixes
        shell: python
        run: |
          from pathlib import Path

          service = Path('android/app/src/main/java/com/exfin/oms/geofence/OfficeLocationService.java')
          text = service.read_text()

          old = '''        JSONObject activeSession = OfficeGeofenceHelper.getActiveSession(this);\n        if (activeSession == null) {'''
          new = '''        JSONObject activeSession = OfficeGeofenceHelper.getActiveSession(this);\n\n        // A finalized session belongs only to the current attendance day. Keep the\n        // native monitor alive after checkout, but allow a new day to become eligible\n        // for automatic check-in without requiring the employee to open the app.\n        if (activeSession != null) {\n            String storedSessionDate = activeSession.optString("date", "");\n            String todayDate = new java.text.SimpleDateFormat("yyyy-MM-dd", java.util.Locale.US)\n                    .format(new java.util.Date());\n            if (!todayDate.equals(storedSessionDate)) {\n                activeSession = null;\n            }\n        }\n\n        if (activeSession == null) {'''
          if old not in text:
              raise SystemExit('OfficeLocationService insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        } else if ("CHECKED_OUT".equalsIgnoreCase(sessionState) || "FINALIZED".equalsIgnoreCase(sessionState)) {\n            clearPendingExitCandidate(this);\n            Log.i(TAG, "Session is finalized. Stopping OfficeLocationService.");\n            stopSelf();\n        }'''
          new = '''        } else if ("CHECKED_OUT".equalsIgnoreCase(sessionState) || "FINALIZED".equalsIgnoreCase(sessionState)) {\n            // Do NOT stop the native monitor after checkout. It must remain alive in\n            // the background so the next attendance day can auto-check-in without\n            // requiring the employee to open the app. The date guard above prevents\n            // the finalized current-day record from creating another check-in today.\n            clearPendingExitCandidate(this);\n            consecutiveOutsideCount = 0;\n            consecutiveInsideCount = 0;\n            Log.i(TAG, "Session is finalized for today; continuing native background monitoring for the next attendance day.");\n        }'''
          if old not in text:
              raise SystemExit('OfficeLocationService finalized block not found')
          text = text.replace(old, new, 1)
          service.write_text(text)

          plugin = Path('android/app/src/main/java/com/exfin/oms/geofence/GeofencePlugin.java')
          text = plugin.read_text()
          old = '''            JSONObject activeSession = OfficeGeofenceHelper.getActiveSession(context);\n            if (activeSession != null) {\n                OfficeLocationService.start(context);\n            }'''
          new = '''            // Repair the native monitor regardless of whether today's attendance\n            // session exists. The service must be alive before check-in so the employee\n            // never needs to open the app just to restart monitoring.\n            OfficeLocationService.start(context);'''
          if old not in text:
              raise SystemExit('GeofencePlugin repair block not found')
          text = text.replace(old, new, 1)
          plugin.write_text(text)

          screen = Path('src/features/attendance/AttendanceScreen.tsx')
          text = screen.read_text()
          old = '''    // 4. Monitoring is not healthy\n    if (!nativeReadiness.geofenceRegistered || !nativeReadiness.foregroundServiceRunning) {\n      return {\n        message: 'Location monitoring needs repair.',\n        buttonText: isRepairingMonitoring ? 'REPAIRING...' : 'REPAIR LOCATION MONITORING',\n        action: async () => {\n          setIsRepairingMonitoring(true);\n          try {\n            await repairNativeLocationMonitoring();\n            await checkReadiness();\n          } finally {\n            setIsRepairingMonitoring(false);\n          }\n        }\n      };\n    }\n\n    return null;'''
          new = '''    // 4. Native monitoring is self-healing. Do not expose a manual repair\n    // button in Attendance; the Android service repairs/reasserts monitoring\n    // independently of the WebView and continues while the app is closed.\n    if (!nativeReadiness.geofenceRegistered || !nativeReadiness.foregroundServiceRunning) {\n      return null;\n    }\n\n    return null;'''
          if old not in text:
              raise SystemExit('AttendanceScreen monitoring warning block not found')
          text = text.replace(old, new, 1)
          screen.write_text(text)

          print('Applied native service self-heal, repair behavior, and removed repeated manual repair UI.')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/exfin/oms/geofence/OfficeLocationService.java android/app/src/main/java/com/exfin/oms/geofence/GeofencePlugin.java src/features/attendance/AttendanceScreen.tsx .github/workflows/fix-location-monitoring-self-heal.yml
          git rm .github/workflows/fix-location-monitoring-self-heal.yml
          git commit -m "fix: make location monitoring self-healing in background"
          git push
