name: One-time employee UI cleanup

on:
  push:
    branches:
      - ui/remove-employee-call-actions

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply employee UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/features/employee/EmployeeDashboard.tsx')
          s = p.read_text()
          s = s.replace('  PhoneCall,\n  Video,\n', '  PhoneCall,\n')
          s, n = re.subn(r"\n\s*\{\s*icon:\s*Video,\s*label:\s*'Video Calls',\s*onClick:\s*\(\)\s*=>\s*window\.dispatchEvent\(new Event\('exfin:open-video-calls'\)\),\s*bg:\s*'bg-indigo-500/15 text-indigo-300 border-indigo-500/30'\s*\},", '', s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'EmployeeDashboard Video Calls block not removed (matches={n})')
          p.write_text(s)

          p = Path('src/features/employee/ChatScreen.tsx')
          s = p.read_text()
          s = s.replace('  Phone,\n  Video,\n', '')
          s, n = re.subn(r"\n\s*// Call Feature Placeholders State\s*const \[callModal, setCallModal\].*?\n\s*\n", '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'ChatScreen call modal state not removed (matches={n})')
          s, n = re.subn(r"\n\s*\{\/\* Video/Audio Call Placeholders \*\/\}.*?\n\s*<\/div>\n", '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'ChatScreen call buttons not removed (matches={n})')
          s, n = re.subn(r"\n\s*\{\/\* CALL FEATURE MODAL PLACEHOLDER \*\/\}.*?<\/Dialog>\n", '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'ChatScreen call modal UI not removed (matches={n})')
          p.write_text(s)

          p = Path('src/components/layout/Layout.tsx')
          s = p.read_text()
          old = "import { Bell, ChevronRight, CheckCheck, Info, User, Home, MapPin, Trash2 } from 'lucide-react';"
          new = "import { Bell, ChevronRight, CheckCheck, Info, User, Home, MapPin, Trash2, MessageCircle } from 'lucide-react';"
          if old not in s: raise SystemExit('Layout icon import not found')
          s = s.replace(old, new, 1)
          anchor = '      <main className="container mx-auto p-4 pt-20 sm:pt-24 max-w-3xl pb-32">\n'
          floating = '''      {!currentUser?.isAdmin && location.pathname !== '/chat' && (\n        <button\n          type="button"\n          onClick={() => navigate('/chat')}\n          aria-label="Open employee chat"\n          className="fixed bottom-20 left-4 z-[80] flex items-center gap-2 rounded-full bg-indigo-600 px-4 py-3 text-sm font-bold text-white shadow-xl hover:bg-indigo-700 active:scale-95 transition-transform"\n        >\n          <MessageCircle className="h-5 w-5" />\n          Chat\n        </button>\n      )}\n\n'''
          if anchor not in s: raise SystemExit('Layout main anchor not found')
          s = s.replace(anchor, floating + anchor, 1)
          p.write_text(s)
          PY
      - name: Validate and commit changes
        shell: bash
        run: |
          npm ci
          npm run lint --if-present
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/employee/EmployeeDashboard.tsx src/features/employee/ChatScreen.tsx src/components/layout/Layout.tsx
          git rm .github/workflows/ui-edit-once.yml
          git commit -m "Update employee chat entry points"
          git push
