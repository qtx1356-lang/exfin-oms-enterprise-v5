name: One-time employee UI cleanup

on:
  push:
    branches:
      - ui/remove-employee-call-actions

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply employee UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/employee/EmployeeDashboard.tsx')
          s = p.read_text().replace('  PhoneCall,\n  Video,\n', '  PhoneCall,\n')
          block = """    { \n      icon: Video, \n      label: 'Video Calls',\n      onClick: () => window.dispatchEvent(new Event('exfin:open-video-calls')), \n      bg: 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30' \n    },\n"""
          if block not in s: raise SystemExit('EmployeeDashboard Video Calls block not found')
          p.write_text(s.replace(block, '', 1))

          p = Path('src/features/employee/ChatScreen.tsx')
          s = p.read_text().replace('  Phone,\n  Video,\n', '')
          state = """  // Call Feature Placeholders State\n  const [callModal, setCallModal] = useState<{ isOpen: boolean; type: 'audio' | 'video' | null }>({\n    isOpen: false,\n    type: null,\n  });\n\n"""
          if state not in s: raise SystemExit('ChatScreen call modal state not found')
          s = s.replace(state, '', 1)
          header = """                {/* Video/Audio Call Placeholders */}\n                <div className=\"flex items-center gap-1.5\">\n                  <button\n                    onClick={() => setCallModal({ isOpen: true, type: 'audio' })}\n                    className=\"p-2 rounded-xl glass-inner-tile hover:bg-white/10 border border-[var(--border)] text-[var(--text-secondary)] transition cursor-pointer\"\n                    title=\"Audio Call\"\n                  >\n                    <Phone className=\"w-4 h-4\" />\n                  </button>\n                  <button\n                    onClick={() => setCallModal({ isOpen: true, type: 'video' })}\n                    className=\"p-2 rounded-xl glass-inner-tile hover:bg-white/10 border border-[var(--border)] text-[var(--text-secondary)] transition cursor-pointer\"\n                    title=\"Video Call\"\n                  >\n                    <Video className=\"w-4 h-4\" />\n                  </button>\n                </div>\n"""
          if header not in s: raise SystemExit('ChatScreen call buttons not found')
          s = s.replace(header, '', 1)
          modal = """\n      {/* CALL FEATURE MODAL PLACEHOLDER */}\n      <Dialog\n        isOpen={callModal.isOpen}\n        onClose={() => setCallModal({ isOpen: false, type: null })}\n        title={callModal.type === 'video' ? 'Video Conference' : 'Voice Connection'}\n      >\n        <div className=\"space-y-4 text-center p-4\">\n          <div className=\"w-16 h-16 rounded-full bg-[var(--primary)]/15 border border-[var(--primary)]/30 flex items-center justify-center mx-auto text-[var(--primary)]\">\n            {callModal.type === 'video' ? <Video className=\"w-8 h-8\" /> : <Phone className=\"w-8 h-8\" />}\n          </div>\n          <div className=\"space-y-2\">\n            <h4 className=\"text-base font-black text-[var(--text-primary)]\">Call Integration Sandbox</h4>\n            <p className=\"text-xs text-[var(--text-secondary)] leading-relaxed max-w-sm mx-auto\">\n              Real-time video and audio calling requires integration with a WebRTC or communication provider (e.g., Twilio, Zoom, or Jitsi). This UI shell is ready for deployment once credentials are configured.\n            </p>\n          </div>\n          <div className=\"pt-2\">\n            <Button\n              onClick={() => setCallModal({ isOpen: false, type: null })}\n              className=\"bg-[var(--button-primary)] hover:opacity-90 w-full rounded-xl text-white\"\n            >\n              Close Call Sandbox\n            </Button>\n          </div>\n        </div>\n      </Dialog>\n"""
          if modal not in s: raise SystemExit('ChatScreen call modal UI not found')
          p.write_text(s.replace(modal, '\n', 1))

          p = Path('src/components/layout/Layout.tsx')
          s = p.read_text()
          old = "import { Bell, ChevronRight, CheckCheck, Info, User, Home, MapPin, Trash2 } from 'lucide-react';"
          new = "import { Bell, ChevronRight, CheckCheck, Info, User, Home, MapPin, Trash2, MessageCircle } from 'lucide-react';"
          if old not in s: raise SystemExit('Layout icon import not found')
          s = s.replace(old, new, 1)
          anchor = "      <main className=\"container mx-auto p-4 pt-20 sm:pt-24 max-w-3xl pb-32\">\n"
          floating = """      {!currentUser?.isAdmin && location.pathname !== '/chat' && (\n        <button\n          type=\"button\"\n          onClick={() => navigate('/chat')}\n          aria-label=\"Open employee chat\"\n          className=\"fixed bottom-20 left-4 z-[80] flex items-center gap-2 rounded-full bg-indigo-600 px-4 py-3 text-sm font-bold text-white shadow-xl hover:bg-indigo-700 active:scale-95 transition-transform\"\n        >\n          <MessageCircle className=\"h-5 w-5\" />\n          Chat\n        </button>\n      )}\n\n"""
          if anchor not in s: raise SystemExit('Layout main anchor not found')
          p.write_text(s.replace(anchor, floating + anchor, 1))
          PY
      - name: Validate and commit changes
        shell: bash
        run: |
          npm ci
          npm run lint --if-present
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/employee/EmployeeDashboard.tsx src/features/employee/ChatScreen.tsx src/components/layout/Layout.tsx
          git rm .github/workflows/ui-edit-once.yml
          git commit -m "Update employee chat entry points"
          git push
