name: Apply native exit recovery fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(attendance): preserve native exit timestamp on app reopen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact recovery fixes
        shell: python
        run: |
          from pathlib import Path

          # Native Android state must expose a persisted exit whenever the native
          # session says checkout confirmation is pending. Do not gate this on
          # the stale last-known INSIDE flag.
          p = Path('android/app/src/main/java/com/exfin/oms/geofence/GeofencePlugin.java')
          s = p.read_text()
          old = 'boolean pendingConf = !isInside && recExit != null && session.optBoolean("pendingCheckoutConfirmation", false);'
          new = 'boolean pendingConf = recExit != null && session.optBoolean("pendingCheckoutConfirmation", false);'
          if old not in s:
              raise SystemExit('GeofencePlugin.java target line not found')
          p.write_text(s.replace(old, new, 1))

          # Native pending exit is authoritative over stale local CHECKED_IN state.
          p = Path('src/services/attendance/nativeGeofenceBridge.ts')
          s = p.read_text()
          old = '''          if (isTodayCheckedIn || isNativeInside) {
            // Employee is inside! Ensure pendingCheckoutConfirmation is false
            if (todayRec && todayRec.pendingCheckoutConfirmation) {
              todayRec.pendingCheckoutConfirmation = false;
              todayRec.currentState = 'CHECKED_IN';
              saveAttendanceRecord(todayRec);
            }
          } else if (hasNativeExit && isPendingExit && !isTodayCheckedIn) {'''
          new = '''          if (hasNativeExit && isPendingExit) {
            // A persisted native exit is authoritative even if the local web record
            // still says CHECKED_IN because the app was closed when the exit occurred.
            // Rehydrate the exact native exit time instead of allowing app-open time
            // to become the suggested checkout time.
            if (todayRec && !todayRec.checkOutTime && !todayRec.checkoutFinalized) {'''
          if old not in s:
              raise SystemExit('nativeGeofenceBridge.ts target block not found')
          s = s.replace(old, new, 1)

          old2 = '''          } else if (!hasNativeExit) {
            if (todayRec && todayRec.pendingCheckoutConfirmation && !todayRec.lastExitTime && !todayRec.geofenceExitTime && !todayRec.recordedExitTime) {'''
          new2 = '''          } else if (isTodayCheckedIn || isNativeInside) {
            // No native pending exit exists, so the normal inside state is authoritative.
            if (todayRec && todayRec.pendingCheckoutConfirmation) {
              todayRec.pendingCheckoutConfirmation = false;
              todayRec.currentState = 'CHECKED_IN';
              saveAttendanceRecord(todayRec);
            }
          } else if (!hasNativeExit) {
            if (todayRec && todayRec.pendingCheckoutConfirmation && !todayRec.lastExitTime && !todayRec.geofenceExitTime && !todayRec.recordedExitTime) {'''
          if old2 not in s:
              raise SystemExit('nativeGeofenceBridge.ts second target block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          # Cold-start modal recovery must not discard a native pending exit just
          # because the local record has not yet been reconciled.
          p = Path('src/components/attendance/CheckoutConfirmationModal.tsx')
          s = p.read_text()
          old = '''        if (curLocalToday && curLocalToday.currentState === 'CHECKED_IN') {
          return;
        }

        const isNativeInside = nativeState.sessionState === 'ACTIVE' || nativeState.currentState === 'CHECKED_IN';
        if (isNativeInside) {
          return;
        }

        const hasNativeExit = !!(nativeState.recordedExitTime && nativeState.recordedExitTime !== 'null' && nativeState.recordedExitTime.trim() !== '');
        const isPendingNativeExit = (nativeState.pendingCheckoutConfirmation ||
          nativeState.sessionState === 'PENDING_EXIT_CONFIRMATION' ||
          nativeState.currentState === 'PENDING_AUTO_CHECKOUT') && hasNativeExit;'''
          new = '''        const hasNativeExit = !!(nativeState.recordedExitTime && nativeState.recordedExitTime !== 'null' && nativeState.recordedExitTime.trim() !== '');
        const isPendingNativeExit = (nativeState.pendingCheckoutConfirmation ||
          nativeState.sessionState === 'PENDING_EXIT_CONFIRMATION' ||
          nativeState.currentState === 'PENDING_AUTO_CHECKOUT') && hasNativeExit;

        // Never let stale local CHECKED_IN state hide a persisted native exit.
        if (curLocalToday && curLocalToday.currentState === 'CHECKED_IN' && !isPendingNativeExit) {
          return;
        }

        const isNativeInside = nativeState.sessionState === 'ACTIVE' || nativeState.currentState === 'CHECKED_IN';
        if (isNativeInside && !isPendingNativeExit) {
          return;
        }'''
          if old not in s:
              raise SystemExit('CheckoutConfirmationModal.tsx target block not found')
          p.write_text(s.replace(old, new, 1))

      - name: Verify changes
        run: |
          grep -F 'boolean pendingConf = recExit != null' android/app/src/main/java/com/exfin/oms/geofence/GeofencePlugin.java
          grep -F 'A persisted native exit is authoritative' src/services/attendance/nativeGeofenceBridge.ts
          grep -F 'Never let stale local CHECKED_IN state hide a persisted native exit' src/components/attendance/CheckoutConfirmationModal.tsx

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/exfin/oms/geofence/GeofencePlugin.java src/services/attendance/nativeGeofenceBridge.ts src/components/attendance/CheckoutConfirmationModal.tsx
          git commit -m 'fix(attendance): preserve native exit timestamp on app reopen'
          git push origin main

      - name: Remove temporary fixer workflow
        if: success()
        run: |
          git rm .github/workflows/apply-native-exit-recovery-fix.yml
          git commit -m 'chore: remove one-time native exit recovery fixer'
          git push origin main
