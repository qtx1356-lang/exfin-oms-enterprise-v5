name: Apply native exit recovery fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact recovery fixes
        shell: python3 {0}
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/java/com/exfin/oms/geofence/GeofencePlugin.java')
          s = p.read_text()
          old = 'boolean pendingConf = !isInside && recExit != null && session.optBoolean("pendingCheckoutConfirmation", false);'
          new = 'boolean pendingConf = recExit != null && session.optBoolean("pendingCheckoutConfirmation", false);'
          if old not in s: raise SystemExit('GeofencePlugin.java target line not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/services/attendance/nativeGeofenceBridge.ts')
          s = p.read_text()
          old = '''          if (isTodayCheckedIn || isNativeInside) {
            // Employee is inside! Ensure pendingCheckoutConfirmation is false
            if (todayRec && todayRec.pendingCheckoutConfirmation) {
              todayRec.pendingCheckoutConfirmation = false;
              todayRec.currentState = 'CHECKED_IN';
              saveAttendanceRecord(todayRec);
            }
          } else if (hasNativeExit && isPendingExit && !isTodayCheckedIn) {'''
          new = '''          if (hasNativeExit && isPendingExit) {
            // Persisted native exit is authoritative even if local state is stale CHECKED_IN.
            if (todayRec && !todayRec.checkOutTime && !todayRec.checkoutFinalized) {'''
          if old not in s: raise SystemExit('nativeGeofenceBridge.ts target block not found')
          s = s.replace(old, new, 1)
          old2 = '''          } else if (!hasNativeExit) {
            if (todayRec && todayRec.pendingCheckoutConfirmation && !todayRec.lastExitTime && !todayRec.geofenceExitTime && !todayRec.recordedExitTime) {'''
          new2 = '''          } else if (isTodayCheckedIn || isNativeInside) {
            if (todayRec && todayRec.pendingCheckoutConfirmation) {
              todayRec.pendingCheckoutConfirmation = false;
              todayRec.currentState = 'CHECKED_IN';
              saveAttendanceRecord(todayRec);
            }
          } else if (!hasNativeExit) {
            if (todayRec && todayRec.pendingCheckoutConfirmation && !todayRec.lastExitTime && !todayRec.geofenceExitTime && !todayRec.recordedExitTime) {'''
          if old2 not in s: raise SystemExit('nativeGeofenceBridge.ts second target block not found')
          p.write_text(s.replace(old2, new2, 1))

          p = Path('src/components/attendance/CheckoutConfirmationModal.tsx')
          s = p.read_text()
          old = '''        if (curLocalToday && curLocalToday.currentState === 'CHECKED_IN') {
          return;
        }

        const isNativeInside = nativeState.sessionState === 'ACTIVE' || nativeState.currentState === 'CHECKED_IN';
        if (isNativeInside) {
          return;
        }

        const hasNativeExit = !!(nativeState.recordedExitTime && nativeState.recordedExitTime !== 'null' && nativeState.recordedExitTime.trim() !== '');
        const isPendingNativeExit = (nativeState.pendingCheckoutConfirmation ||
          nativeState.sessionState === 'PENDING_EXIT_CONFIRMATION' ||
          nativeState.currentState === 'PENDING_AUTO_CHECKOUT') && hasNativeExit;'''
          new = '''        const hasNativeExit = !!(nativeState.recordedExitTime && nativeState.recordedExitTime !== 'null' && nativeState.recordedExitTime.trim() !== '');
        const isPendingNativeExit = (nativeState.pendingCheckoutConfirmation ||
          nativeState.sessionState === 'PENDING_EXIT_CONFIRMATION' ||
          nativeState.currentState === 'PENDING_AUTO_CHECKOUT') && hasNativeExit;
        if (curLocalToday && curLocalToday.currentState === 'CHECKED_IN' && !isPendingNativeExit) return;
        const isNativeInside = nativeState.sessionState === 'ACTIVE' || nativeState.currentState === 'CHECKED_IN';
        if (isNativeInside && !isPendingNativeExit) return;'''
          if old not in s: raise SystemExit('CheckoutConfirmationModal.tsx target block not found')
          p.write_text(s.replace(old, new, 1))

      - name: Commit and remove fixer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/com/exfin/oms/geofence/GeofencePlugin.java src/services/attendance/nativeGeofenceBridge.ts src/components/attendance/CheckoutConfirmationModal.tsx
          git commit -m 'fix(attendance): preserve native exit timestamp on app reopen'
          git push origin main
          git rm .github/workflows/apply-native-exit-recovery-fix.yml
          git commit -m 'chore: remove one-time native exit recovery fixer'
          git push origin main
