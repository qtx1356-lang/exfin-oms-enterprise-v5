name: Apply GPS UI Refresh Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply foreground GPS responsiveness patch
        shell: bash
        run: |
          set -euo pipefail
          file="src/context/LocationContext.tsx"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/context/LocationContext.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('return ageMs > 45000;', 'return ageMs > 15000;'),
              ('const maxAllowedAgeMs = isApproachingOrNear ? 3000 : 20000;', 'const maxAllowedAgeMs = isApproachingOrNear ? 3000 : 5000;'),
              ('const nextDelayMs = isApproachingOrNear ? 3000 : 20000;', 'const nextDelayMs = isApproachingOrNear ? 3000 : 5000;'),
              ('const initialDelay = (latestDistanceRef.current !== null && latestDistanceRef.current <= 500) ? 3000 : 20000;', 'const initialDelay = (latestDistanceRef.current !== null && latestDistanceRef.current <= 500) ? 3000 : 5000;'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected source text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/context/LocationContext.tsx

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-gps-ui-refresh-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/LocationContext.tsx .github/workflows/apply-gps-ui-refresh-fix.yml
          git commit -m "fix: refresh foreground GPS UI every 5 seconds"
          git push origin HEAD:main
